<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karang Taruna Blok B - Kas Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#0a0a0a;color:#fff;padding:14px}
.card{background:#171717;border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid #262626}
.saldo{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff}
.stat b{font-size:28px;display:block}
input,select{width:100%;padding:12px;background:#262626;border:1px solid #333;border-radius:12px;color:#fff;margin-top:6px}
button{padding:12px;border:none;border-radius:12px;font-weight:700;cursor:pointer}
.btn-wa{background:#25D366;color:#fff;width:100%;font-size:16px}
.badge{padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700}
.lunas{background:#16a34a}.belum{background:#ef4444}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #262626;font-size:13px;text-align:left}
.thumb{width:50px;height:50px;border-radius:8px;object-fit:cover}
</style>
</head>
<body>
<div style="max-width:600px;margin:auto">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0">
    <h2>Dashboard Kas<br><small style="color:#22c55e">Karang Taruna Blok B</small></h2>
    <span style="color:#888;font-size:12px">karangtaruna-blokb.vercel.app</span>
  </div>

  <div class="card saldo">
    <small>Saldo Kas</small><b id="saldo" style="font-size:32px"></b>
    <div style="display:flex;gap:8px;margin-top:10px;font-size:12px">
      <span id="masuk" style="background:rgba(255,255,255,.2);padding:4px 8px;border-radius:8px"></span>
      <span id="keluar" style="background:rgba(0,0,0,.3);padding:4px 8px;border-radius:8px"></span>
    </div>
  </div>

  <div class="card">
    <h4>👤 Tambah Anggota</h4>
    <input id="nama" placeholder="Nama (contoh: Budi)">
    <input id="wa" placeholder="No WA 62812xxxx">
    <button onclick="addAnggota()" style="width:100%;margin-top:8px;background:#fff;color:#000">Simpan Anggota</button>
  </div>

  <div class="card">
    <h4>💰 Input Transaksi</h4>
    <select id="tipe"><option value="MASUK">Pemasukan / Iuran</option><option value="KELUAR">Pengeluaran</option></select>
    <input id="jml" type="number" placeholder="Jumlah Rp">
    <input id="ket" placeholder="Keterangan (Nama yang bayar / beli apa)">
    <input type="file" id="foto" accept="image/*" style="margin-top:8px">
    <button onclick="addKas()" style="width:100%;margin-top:8px;background:#22c55e;color:#fff">Simpan</button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between"><h4>Daftar Anggota</h4><small id="bulan"></small></div>
    <table><tbody id="listAnggota"></tbody></table>
    <button class="btn-wa" onclick="tagihSemua()" style="margin-top:12px">📲 Tagih WA Semua Yang Belum Bayar</button>
  </div>

  <div class="card"><h4>Buku Kas</h4><table><tbody id="listKas"></tbody></table></div>
</div>

<script>
let kas=JSON.parse(localStorage.getItem('kas_blokb')||'[]');
let anggota=JSON.parse(localStorage.getItem('angg_blokb')||'[]');
let fotoTemp=null;
const bulan=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][new Date().getMonth()];
document.getElementById('bulan').innerText=bulan;
document.getElementById('foto').addEventListener('change',e=>{
  const r=new FileReader();r.onload=x=>fotoTemp=x.target.result;r.readAsDataURL(e.target.files[0])
});

function save(){localStorage.setItem('kas_blokb',JSON.stringify(kas));localStorage.setItem('angg_blokb',JSON.stringify(anggota));render()}
function addAnggota(){
  if(!nama.value||!wa.value) return alert('Isi nama & WA');
  anggota.push({id:Date.now(),nama:nama.value,wa:wa.value.replace(/\D/g,'')});
  nama.value='';wa.value='';save();
}
function addKas(){
  if(!jml.value) return alert('Isi jumlah');
  kas.push({id:Date.now(),tipe:tipe.value,jumlah:+jml.value,ket:ket.value,bulan,foto:tipe.value=='KELUAR'?fotoTemp:null,tgl:new Date().toLocaleDateString('id-ID')});
  jml.value='';ket.value='';fotoTemp=null;save();
}
function pesan(n){return `Halo *${n}* 👋\n\n*Tagihan Iuran Karang Taruna Blok B*\nBulan: *${bulan}*\nJumlah: *Rp 50.000*\n\nMohon dibayarkan ya 🙏\n\nLink kas: https://karangtaruna-blokb.vercel.app`;}
function tagih(n,w){window.open(`https://wa.me/${w}?text=${encodeURIComponent(pesan(n))}`,'_blank')}
function tagihSemua(){
  let belum=anggota.filter(a=>!kas.some(k=>k.tipe=='MASUK'&&k.bulan==bulan&&k.ket.toLowerCase().includes(a.nama.toLowerCase())));
  if(!belum.length) return alert('Semua lunas!');
  belum.forEach((a,i)=>setTimeout(()=>tagih(a.nama,a.wa),i*1200));
}
function render(){
  let m=kas.filter(k=>k.tipe=='MASUK').reduce((a,b)=>a+b.jumlah,0);
  let k=kas.filter(k=>k.tipe=='KELUAR').reduce((a,b)=>a+b.jumlah,0);
  saldo.innerText='Rp '+(m-k).toLocaleString('id-ID');masuk.innerText='Masuk Rp '+m.toLocaleString('id-ID');keluar.innerText='Keluar Rp '+k.toLocaleString('id-ID');
  listAnggota.innerHTML=anggota.map(a=>{
    let lunas=kas.some(x=>x.tipe=='MASUK'&&x.bulan==bulan&&x.ket.toLowerCase().includes(a.nama.toLowerCase()));
    return `<tr><td>${a.nama}<br><small style="color:#888">${a.wa}</small></td><td><span class="badge ${lunas?'lunas':'belum'}">${lunas?'LUNAS':'BELUM'}</span></td><td><button onclick="tagih('${a.nama}','${a.wa}')" style="background:#25D366;color:#fff;padding:6px 12px">WA</button></td></tr>`
  }).join('')||'<tr><td colspan=3 style="text-align:center;color:#666">Belum ada anggota</td></tr>';
  listKas.innerHTML=kas.slice().reverse().map(x=>`<tr><td>${x.tgl}</td><td>${x.ket}<br><small>${x.bulan}</small></td><td style="color:${x.tipe=='MASUK'?'#22c55e':'#ef4444'}">Rp ${x.jumlah.toLocaleString('id-ID')}</td></tr>`).join('')||'<tr><td colspan=3 style="text-align:center;color:#666">Belum ada transaksi</td></tr>';
}
render();
</script>
</body>
</html>
