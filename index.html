<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARTAR V11 MINIMAL JALAN</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>body{font-family:Arial;background:#f5f5f2;margin:0}.box{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:80px}.card{margin:12px;border-radius:12px;padding:14px}.w{background:#FFFEF0;border:1px solid #FFEC99}.b{background:#0F0F0F;color:#fff}.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:700;margin-top:8px}.bg{background:#22c55e;color:#fff}.br{background:#ef4444;color:#fff}.bd{background:#000;color:#fff}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-top:6px}.b input,.b select{background:#222;color:#fff;border:1px solid #444}.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #333;font-size:13px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#000;display:flex;justify-content:space-around;padding:10px 0}.nav button{background:none;border:none;color:#fff;font-size:12px;opacity:.6}.nav button.on{opacity:1;color:#FFD60A}.hidden{display:none!important}</style></head><body><div class="box">
<div id="login"><div style="padding:30px;text-align:center"><h1>KARTAR BLOK B</h1><p>V11 MINIMAL JALAN 100%</p><div class="card w" style="text-align:left"><b>Login</b><br><small>Kosong=Warga, blokb2026=Admin</small><input id="pass" type="password" placeholder="Password"><button class="btn bd" onclick="doLogin()">MASUK</button></div></div></div>
<div id="warga" class="hidden"><div style="display:flex;justify-content:space-between;padding:12px;background:#FFD60A"><b>WARGA VIEW</b><span id="wJml">0</span></div><div class="card w"><h2 id="wTotal">Rp 0</h2><div id="wList"></div><button class="btn bd" onclick="goAdmin()">Login Admin</button></div></div>
<div id="admin" class="hidden"><div style="display:flex;justify-content:space-between;padding:12px;background:#000;color:#fff;align-items:center"><b>ADMIN V11</b><div><span id="aJml"></span> <button onclick="logout()" style="margin-left:8px;padding:5px 12px;border-radius:20px;background:#ef4444;color:#fff;border:none;font-weight:700">LOGOUT</button></div></div>
<div id="t-dash"><div class="card b"><div style="text-align:center"><small id="today"></small><h2 id="aTotal" style="color:#22c55e;font-size:28px">Rp 0</h2></div><div id="aList"></div><div style="margin-top:14px;padding:12px;background:#222;border-radius:10px"><b>Tambah</b><input id="nama" placeholder="Nama"><input id="wa" placeholder="WA 628..."><input id="nom" type="number" placeholder="Nominal"><select id="jenis"><option value="in">Masuk</option><option value="out">Keluar</option></select><button class="btn bg" onclick="tambah()">SIMPAN ONLINE</button><button class="btn" style="background:#FFD60A;color:#000" onclick="sync()">TARIK ONLINE</button><button class="btn br" onclick="logout()">LOGOUT</button></div></div></div>
<div id="t-warga" class="hidden"><div class="card b"><b>Anggota</b><input id="cari" placeholder="Cari..." onkeyup="render()"><div id="listWarga"></div></div></div>
<div class="nav"><button id="n-dash" class="on" onclick="tab('dash')">Dashboard</button><button id="n-warga" onclick="tab('warga')">Warga</button></div>
</div></div><script>
var firebaseConfig={apiKey:"AIzaSyBykYOwRYyKNKkb0-tYblcwwDABWMnN4ko",authDomain:"blokb-online.firebaseapp.com",databaseURL:"https://blokb-online-default-rtdb.firebaseio.com",projectId:"blokb-online",storageBucket:"blokb-online.firebasestorage.app",messagingSenderId:"589827226624",appId:"1:589827226624:web:742737eae422e111b8ace5"};
firebase.initializeApp(firebaseConfig);var db=firebase.database();var data=JSON.parse(localStorage.getItem('kartar_data')||'[]');document.getElementById('today').innerText=new Date().toLocaleDateString('id-ID');
db.ref('kartar').on('value',function(s){if(s.val()){var v=s.val();data=Array.isArray(v)?v:Object.values(v);localStorage.setItem('kartar_data',JSON.stringify(data));}render();});
function render(){var masuk=0,keluar=0;for(var i=0;i<data.length;i++){if(data[i].jenis==='out') keluar+=data[i].nom||0; else masuk+=data[i].nom||0;}var saldo=masuk-keluar;document.getElementById('aTotal').innerText='Rp '+saldo.toLocaleString('id-ID');document.getElementById('wTotal').innerText='Rp '+saldo.toLocaleString('id-ID');document.getElementById('aJml').innerText=data.length+' org';document.getElementById('wJml').innerText=data.length+' org';var html='';for(var j=data.length-1;j>=0&&j>data.length-6;j--){html+='<div class="item"><span>'+data[j].nama+'</span><b>Rp '+data[j].nom.toLocaleString('id-ID')+'</b></div>';}document.getElementById('aList').innerHTML=html||'Belum ada';document.getElementById('wList').innerHTML=html||'Belum ada';renderWarga();}
function renderWarga(){var q=(document.getElementById('cari')?document.getElementById('cari').value:'').toLowerCase();var el=document.getElementById('listWarga');if(!el) return;var h='';for(var i=0;i<data.length;i++){if(data[i].nama.toLowerCase().indexOf(q)===-1) continue;h+='<div class="item"><div><b>'+data[i].nama+'</b><br><small>'+(data[i].wa||'No WA')+' • Rp '+data[i].nom.toLocaleString('id-ID')+'</small></div><div><button onclick="editData('+i+')" style="padding:5px 8px;background:#FFD60A;border:none;border-radius:10px;font-size:10px">EDIT</button> <button onclick="hapusData('+i+')" style="padding:5px 8px;background:#ef4444;color:#fff;border:none;border-radius:10px;font-size:10px">HAPUS</button> <button onclick="wa('+data[i].wa+')" style="padding:5px 8px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:10px">WA</button></div></div>';}el.innerHTML=h||'Kosong';}
function tab(t){document.getElementById('t-dash').classList.add('hidden');document.getElementById('t-warga').classList.add('hidden');document.getElementById('n-dash').classList.remove('on');document.getElementById('n-warga').classList.remove('on');document.getElementById('t-'+t).classList.remove('hidden');document.getElementById('n-'+t).classList.add('on');}
function wa(num){if(!num||num.length<5){alert('WA kosong, edit dulu');return;}var n=num.replace(/[^0-9]/g,'');if(n.charAt(0)=='0') n='62'+n.substring(1);window.open('https://wa.me/'+n,'_blank');}
function editData(i){var d=data[i];var nn=prompt('Nama:',d.nama);if(nn==null) return;var nwa=prompt('WA:',d.wa||'');if(nwa==null) return;var nnom=prompt('Nominal:',d.nom);if(nnom==null) return;data[i].nama=nn;data[i].wa=nwa;data[i].nom=parseInt(nnom)||d.nom;db.ref('kartar').set(data).then(function(){localStorage.setItem('kartar_data',JSON.stringify(data));alert('Update ok');render();});}
function hapusData(i){if(!confirm('Hapus '+data[i].nama+'?')) return;data.splice(i,1);db.ref('kartar').set(data).then(function(){localStorage.setItem('kartar_data',JSON.stringify(data));alert('Hapus ok');render();});}
function doLogin(){var p=document.getElementById('pass').value;if(p==='blokb2026'){localStorage.setItem('admin','1');showAdmin();}else if(!p){showWarga();}else alert('Salah');}
function showWarga(){document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.add('hidden');document.getElementById('warga').classList.remove('hidden');render();}
function goAdmin(){var p=prompt('Password admin:');if(p==='blokb2026'){localStorage.setItem('admin','1');showAdmin();}}
function showAdmin(){document.getElementById('login').classList.add('hidden');document.getElementById('warga').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');tab('dash');render();}
function logout(){localStorage.removeItem('admin');location.reload();}
function tambah(){var n=document.getElementById('nama').value;var w=document.getElementById('wa').value;var nom=parseInt(document.getElementById('nom').value);var jenis=document.getElementById('jenis').value;if(!n||!nom){alert('Isi nama nominal');return;}var baru={nama:n,wa:w,nom:nom,jenis:jenis,tgl:Date.now()};db.ref('kartar').once('value',function(s){var online=s.val()?(Array.isArray(s.val())?s.val():Object.values(s.val())):[];var gab=[...online,baru];db.ref('kartar').set(gab).then(function(){data=gab;localStorage.setItem('kartar_data',JSON.stringify(data));alert('Simpan '+n);document.getElementById('nama').value='';document.getElementById('wa').value='';document.getElementById('nom').value='';render();});});}
function sync(){db.ref('kartar').once('value',function(s){if(s.val()){var v=s.val();data=Array.isArray(v)?v:Object.values(v);localStorage.setItem('kartar_data',JSON.stringify(data));alert('Ditarik '+data.length);location.reload();}else alert('Firebase kosong');});}
if(localStorage.getItem('admin')==='1') showAdmin();
</script></body></html>
