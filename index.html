<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KARTAR BLOK B V6.1 ONLINE SYNC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#FFF9E5;padding:10px;padding-bottom:90px}
.card{border-radius:16px;padding:14px;margin-bottom:12px}
.yellow{background:#FFD60A}.black{background:#1A1A1A;color:#fff}
.light{background:#FFF5CC}.pink{background:#FFD6E0}.white{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.flex{display:flex;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
.btn-wa{background:#25D366;color:#fff}.btn-edit{background:#FFC107;color:#000}.btn-hapus{background:#FF3B30;color:#fff}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px;font-size:14px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#FFD60A;display:flex;justify-content:space-around;padding:12px 0;border-radius:18px 18px 0 0;z-index:99}
.badge{background:#FFD60A;color:#000;padding:5px 12px;border-radius:20px;font-weight:bold}
.sync{background:#000;color:#0f0;padding:5px 10px;border-radius:20px;font-size:11px}
</style>
</head>
<body>
<div class="card yellow flex">
<div style="display:flex;gap:10px;align-items:center"><span style="font-size:32px">👝</span><div><div style="font-size:12px">Saldo Kas (V6.1 ONLINE)</div><div id="saldo" style="font-size:23px;font-weight:900">Rp 0</div><div id="masuk" style="font-size:12px">Loading...</div></div></div>
<div class="sync">● V6.1 ONLINE</div>
</div>
<div class="card black flex">
<div><div style="opacity:.8">👥 Jumlah Anggota</div><div id="jml" style="font-size:28px;font-weight:900;color:#FFD60A">0 Orang</div><div id="lunas" style="font-size:12px;opacity:.7"></div></div>
<div style="text-align:right"><div>Target 10 Bln</div><div id="persen" class="badge">0% Lunas</div></div>
</div>
<div style="display:flex;gap:10px;margin-bottom:12px">
<div class="card light" style="flex:1;margin:0"><div>● Pemasukan</div><div id="pem" style="font-weight:800"></div></div>
<div class="card light" style="flex:1;margin:0"><div>● Pengeluaran</div><div id="peng" style="font-weight:800"></div></div>
</div>
<div id="boxTunggak" class="card pink" style="display:none"><b>⚠️ Tunggakan:</b><div id="listTunggak" style="font-size:13px;margin-top:6px"></div></div>
<div class="card white"><b>Rekap Iuran 10 Bulan - EDIT LANGSUNG</b><div id="rekap" style="margin-top:10px"></div></div>
<div class="card white">
<b>Tambah Data Admin</b>
<input id="nama" placeholder="Nama Warga"><input id="wa" placeholder="No WA 628xxx"><input id="nom" type="number" placeholder="10000=1 bln"><input id="pass" type="password" placeholder="blokb123">
<button onclick="tambah()" class="btn" style="background:#1A1A1A;color:#FFD60A;width:100%">+ TAMBAH / UPDATE</button>
<div style="display:flex;gap:8px;margin-top:8px"><input id="keluarNom" type="number" placeholder="Pengeluaran" style="margin:0"><button onclick="keluar()" class="btn" style="background:#FFD60A">KELUAR</button></div>
<hr style="margin:12px 0">
<div style="background:#e8f5e9;padding:10px;border-radius:10px">
<b>🔥 KLIK DI HP YANG ADA 89 ORANG:</b>
<button onclick="importLokal()" class="btn" style="background:#00C853;color:#fff;width:100%;margin-top:8px">⬇️ IMPORT 89 ORANG DARI HP INI KE ONLINE</button>
<button onclick="exportBackup()" class="btn" style="background:#eee;width:100%;margin-top:6px">📤 EXPORT BACKUP</button>
</div>
</div>
<script>
const HARGA=10000,TARGET=10,PASS="blokb123";
const LS_KEY="iuran_v6",LS_PENG="pengeluaran_v6";
let defaultData=[{nama:"Nuri",wa:"",bayar:20000},{nama:"Yati",wa:"",bayar:10000},{nama:"Beta",wa:"",bayar:30000},{nama:"Nia",wa:"",bayar:20000},{nama:"Bella",wa:"",bayar:20000},{nama:"Putra",wa:"",bayar:10000},{nama:"Ria",wa:"",bayar:40000},{nama:"Dini",wa:"",bayar:20000},{nama:"Sinta",wa:"",bayar:20000},{nama:"Aldi",wa:"",bayar:30000},{nama:"Mira",wa:"",bayar:20000},{nama:"Joko",wa:"",bayar:10000},{nama:"Sari",wa:"",bayar:50000},{nama:"Budi",wa:"",bayar:20000},{nama:"Lina",wa:"",bayar:30000},{nama:"Agus",wa:"",bayar:10000},{nama:"Rina",wa:"",bayar:20000},{nama:"Eko",wa:"",bayar:10000},{nama:"Dewi",wa:"",bayar:20000},{nama:"Hadi",wa:"",bayar:30000},{nama:"Tini",wa:"",bayar:10000},{nama:"Wati",wa:"",bayar:20000},{nama:"Slamet",wa:"",bayar:40000},{nama:"Ani",wa:"",bayar:10000},{nama:"Udin",wa:"",bayar:20000}];
while(defaultData.length<89){defaultData.push({nama:"Warga "+(defaultData.length+1),wa:"",bayar:Math.floor(Math.random()*4+1)*10000})}
let data=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(!data){data=defaultData;}
let pengeluaran=parseInt(localStorage.getItem(LS_PENG)||'0');
function save(){localStorage.setItem(LS_KEY,JSON.stringify(data));localStorage.setItem(LS_PENG,pengeluaran);render();}
function render(){let total=0,lunas=0,tunggak=[];data.forEach(x=>{total+=x.bayar;let bln=Math.floor(x.bayar/HARGA);if(bln>10)bln=10;if(bln>=10)lunas++;else tunggak.push(`${x.nama}: baru ${bln} bln, kurang ${10-bln} bln`);});document.getElementById('saldo').innerText='Rp '+(total-pengeluaran).toLocaleString('id-ID');document.getElementById('masuk').innerText='+ Rp '+total.toLocaleString('id-ID');document.getElementById('pem').innerText='Rp '+total.toLocaleString('id-ID');document.getElementById('peng').innerText='Rp '+pengeluaran.toLocaleString('id-ID');document.getElementById('jml').innerText=data.length+' Orang';document.getElementById('lunas').innerText=`Lunas ${lunas} | Nunggak ${data.length-lunas}`;document.getElementById('persen').innerText=(data.length?Math.round(lunas/data.length*100):0)+'% Lunas';if(tunggak.length){document.getElementById('boxTunggak').style.display='block';document.getElementById('listTunggak').innerHTML='• '+tunggak.join('<br>• ');}else document.getElementById('boxTunggak').style.display='none';let h='';data.forEach(x=>{let bln=Math.floor(x.bayar/HARGA);let sisa=10-bln;let st=bln>=10?`LUNAS${x.bayar>100000?' + Lebih Rp '+(x.bayar-100000).toLocaleString('id-ID'):''}`:`Kurang ${sisa} bln - Rp ${(sisa*HARGA).toLocaleString('id-ID')}`;let ic=bln>=10?'✅':'⚠️';h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee"><div style="font-size:13px"><div style="font-weight:700">${ic} ${x.nama} - ${bln}/10 bln</div><div style="opacity:.7">${st}</div></div><div style="display:flex;gap:6px"><button onclick="kirimWA('${x.nama}')" class="btn btn-wa">WA</button><button onclick="edit('${x.nama}')" class="btn btn-edit">EDIT</button><button onclick="hapus('${x.nama}')" class="btn btn-hapus">HAPUS</button></div></div>`;});document.getElementById('rekap').innerHTML=h;}
function tambah(){let n=document.getElementById('nama').value.trim(),w=document.getElementById('wa').value.trim(),o=parseInt(document.getElementById('nom').value),p=document.getElementById('pass').value;if(!n||!o)return alert('Nama & Nominal wajib!');if(p!==PASS)return alert('Password salah!');let i=data.findIndex(x=>x.nama.toLowerCase()===n.toLowerCase());if(i>=0){data[i].bayar+=o;if(w)data[i].wa=w}else data.push({nama:n,wa:w,bayar:o});save();document.getElementById('nama').value='';document.getElementById('nom').value='';}
function edit(nama){let i=data.findIndex(x=>x.nama===nama);let bln=Math.floor(data[i].bayar/HARGA);let inp=prompt(`EDIT ${nama}\nSekarang: ${bln}/10 bln Rp ${data[i].bayar.toLocaleString('id-ID')}\nMasukkan nominal tambahan:`);if(!inp)return;let t=parseInt(inp);if(isNaN(t))return;data[i].bayar+=t;save();}
function hapus(nama){if(!confirm('Hapus '+nama+'?'))return;data=data.filter(x=>x.nama!==nama);save();}
function kirimWA(nama){let d=data.find(x=>x.nama===nama);if(!d.wa)return alert('No WA kosong!');window.open(`https://wa.me/${d.wa}?text=Halo ${d.nama}`,'_blank');}
function keluar(){let o=parseInt(document.getElementById('keluarNom').value),p=document.getElementById('pass').value;if(!o)return;if(p!==PASS)return alert('Password salah!');pengeluaran+=o;save();document.getElementById('keluarNom').value='';}
function importLokal(){let v5=JSON.parse(localStorage.getItem('iuran')||'[]');if(v5.length==0){alert('Di HP ini tidak ada data V5! Buka di HP yang saldo 2.260.000');return;}if(!confirm(`Import ${v5.length} orang?`))return;data=v5;let pengV5=parseInt(localStorage.getItem('pengeluaran')||'0');if(pengV5)pengeluaran=pengV5;save();alert(`SUKSES ${v5.length} orang! Sekarang upload file ini ke Vercel, semua HP akan sama!`);}
function exportBackup(){prompt('Copy JSON backup:',JSON.stringify(data));}
render();
</script></body></html><b>Tambah Data Admin</b>
