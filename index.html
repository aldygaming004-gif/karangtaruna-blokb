<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KARTAR BLOK B V6.2</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{background:#FFF9E5;padding:10px;padding-bottom:90px}.card{border-radius:16px;padding:14px;margin-bottom:12px}.yellow{background:#FFD60A}.black{background:#1A1A1A;color:#fff}.light{background:#FFF5CC}.pink{background:#FFD6E0}.white{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}.flex{display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn-wa{background:#25D366;color:#fff}.btn-edit{background:#FFC107;color:#000}.btn-hapus{background:#FF3B30;color:#fff}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px}.badge{background:#FFD60A;color:#000;padding:5px 12px;border-radius:20px;font-weight:bold}.loginBox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}.loginCard{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:350px}.adminOnly{display:none}.isAdmin .adminOnly{display:block!important}.btn-edit,.btn-hapus{display:none!important}.isAdmin .btn-edit,.isAdmin .btn-hapus{display:inline-block!important}</style></head><body id="body">
<div class="card yellow flex"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:32px">👝</span><div><div>Saldo Kas V6.2</div><div id="saldo" style="font-size:23px;font-weight:900">Rp 0</div><div id="masuk" style="font-size:12px"></div></div></div><div><button id="btnLogin" onclick="openLogin()" class="btn" style="background:#000;color:#FFD60A;font-size:12px">🔐 LOGIN ADMIN</button></div></div>
<div class="card black flex"><div><div>👥 Anggota</div><div id="jml" style="font-size:28px;font-weight:900;color:#FFD60A"></div><div id="lunas" style="font-size:12px;opacity:.7"></div></div><div style="text-align:right"><div id="persen" class="badge"></div></div></div>
<div style="display:flex;gap:10px;margin-bottom:12px"><div class="card light" style="flex:1;margin:0"><div>● Masuk</div><div id="pem"></div></div><div class="card light" style="flex:1;margin:0"><div>● Keluar</div><div id="peng"></div></div></div>
<div id="boxTunggak" class="card pink"><b>⚠️ Tunggakan:</b><div id="listTunggak" style="font-size:13px;margin-top:6px"></div></div>
<div class="card white"><b>Rekap Iuran</b><div id="hintEdit" style="font-size:11px;opacity:.6">Login admin untuk edit</div><div id="rekap" style="margin-top:10px"></div></div>
<div class="card white adminOnly"><b>Panel Admin</b><input id="nama" placeholder="Nama Warga"><input id="wa" placeholder="No WA"><input id="nom" type="number" placeholder="10000=1 bln"><button onclick="tambah()" class="btn" style="background:#1A1A1A;color:#FFD60A;width:100%">+ TAMBAH</button><div style="display:flex;gap:8px;margin-top:8px"><input id="keluarNom" type="number" placeholder="Pengeluaran" style="margin:0"><button onclick="keluar()" class="btn" style="background:#FFD60A">KELUAR</button></div><hr style="margin:12px 0"><button onclick="importLokal()" class="btn" style="background:#00C853;color:#fff;width:100%">⬇️ IMPORT 89 ORANG</button><button onclick="logout()" class="btn" style="background:#FF3B30;color:#fff;width:100%;margin-top:6px">LOGOUT</button></div>
<div id="loginBox" class="loginBox" onclick="if(event.target==this)closeLogin()"><div class="loginCard"><h3 style="text-align:center">🔐 Login Admin</h3><input id="loginPass" type="password" placeholder="••••••••" style="margin-top:12px"><button onclick="doLogin()" class="btn" style="background:#1A1A1A;color:#FFD60A;width:100%;margin-top:8px">LOGIN</button><button onclick="closeLogin()" class="btn" style="background:#eee;width:100%;margin-top:6px">Batal</button></div></div>
<script>
const HARGA=10000,PASS="blokb2026";
const LS_KEY="iuran_v6",LS_PENG="pengeluaran_v6",LS_ADMIN="isAdmin_v6";
let defaultData=[{nama:"Nuri",wa:"",bayar:20000},{nama:"Yati",wa:"",bayar:10000},{nama:"Beta",wa:"",bayar:30000},{nama:"Nia",wa:"",bayar:20000},{nama:"Bella",wa:"",bayar:20000},{nama:"Putra",wa:"",bayar:10000},{nama:"Ria",wa:"",bayar:40000},{nama:"Dini",wa:"",bayar:20000},{nama:"Sinta",wa:"",bayar:20000},{nama:"Aldi",wa:"",bayar:30000}];
while(defaultData.length<89){defaultData.push({nama:"Warga "+(defaultData.length+1),wa:"",bayar:Math.floor(Math.random()*4+1)*10000})}
let data=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(!data){data=defaultData;}
let pengeluaran=parseInt(localStorage.getItem(LS_PENG)||'0');let isAdmin=localStorage.getItem(LS_ADMIN)==='1';
function save(){localStorage.setItem(LS_KEY,JSON.stringify(data));localStorage.setItem(LS_PENG,pengeluaran);render();}
function applyAdmin(){if(isAdmin){document.body.classList.add('isAdmin');document.getElementById('btnLogin').innerText='✅ ADMIN';document.getElementById('hintEdit').innerText='Mode Admin aktif';}else{document.body.classList.remove('isAdmin');document.getElementById('btnLogin').innerText='🔐 LOGIN ADMIN';document.getElementById('hintEdit').innerText='Login admin untuk edit';}}
function render(){let total=0,lunas=0,tunggak=[];data.forEach(x=>{total+=x.bayar;let bln=Math.floor(x.bayar/HARGA);if(bln>=10)lunas++;else tunggak.push(`${x.nama}: ${bln}/10 bln`);});document.getElementById('saldo').innerText='Rp '+(total-pengeluaran).toLocaleString('id-ID');document.getElementById('masuk').innerText='+ Rp '+total.toLocaleString('id-ID');document.getElementById('pem').innerText='Rp '+total.toLocaleString('id-ID');document.getElementById('peng').innerText='Rp '+pengeluaran.toLocaleString('id-ID');document.getElementById('jml').innerText=data.length+' Orang';document.getElementById('lunas').innerText=`Lunas ${lunas} | Nunggak ${data.length-lunas}`;document.getElementById('persen').innerText=Math.round(lunas/data.length*100)+'% Lunas';document.getElementById('listTunggak').innerHTML=tunggak.join('<br>');let h='';data.forEach(x=>{let bln=Math.floor(x.bayar/HARGA);h+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><div>${x.nama} - ${bln}/10 bln</div><div><button onclick="kirimWA('${x.nama}')" class="btn btn-wa" style="display:inline-block!important">WA</button><button onclick="edit('${x.nama}')" class="btn btn-edit">EDIT</button><button onclick="hapus('${x.nama}')" class="btn btn-hapus">HAPUS</button></div></div>`});document.getElementById('rekap').innerHTML=h;}
function openLogin(){document.getElementById('loginBox').style.display='flex';}function closeLogin(){document.getElementById('loginBox').style.display='none';}
function doLogin(){if(document.getElementById('loginPass').value!==PASS){alert('Password salah!');return;}isAdmin=true;localStorage.setItem(LS_ADMIN,'1');applyAdmin();closeLogin();render();}
function logout(){isAdmin=false;localStorage.removeItem(LS_ADMIN);applyAdmin();render();}
function tambah(){if(!isAdmin)return;let n=document.getElementById('nama').value.trim(),w=document.getElementById('wa').value.trim(),o=parseInt(document.getElementById('nom').value);if(!n||!o)return;let i=data.findIndex(x=>x.nama.toLowerCase()===n.toLowerCase());if(i>=0){data[i].bayar+=o;if(w)data[i].wa=w}else data.push({nama:n,wa:w,bayar:o});save();document.getElementById('nama').value='';document.getElementById('nom').value='';}
function edit(nama){if(!isAdmin)return;let i=data.findIndex(x=>x.nama===nama);let inp=prompt('Tambahan nominal:');if(!inp)return;data[i].bayar+=parseInt(inp);save();}
function hapus(nama){if(!isAdmin)return;if(!confirm('Hapus '+nama+'?'))return;data=data.filter(x=>x.nama!==nama);save();}
function kirimWA(nama){let d=data.find(x=>x.nama===nama);if(!d.wa)return alert('No WA kosong');window.open(`https://wa.me/${d.wa}`,'_blank');}
function keluar(){if(!isAdmin)return;let o=parseInt(document.getElementById('keluarNom').value);if(!o)return;pengeluaran+=o;save();}
function importLokal(){let v5=JSON.parse(localStorage.getItem('iuran')||'[]');if(v5.length==0){alert('Tidak ada data V5');return;}data=v5;save();}
applyAdmin();render();
</script></body></html>
