<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karang Taruna Blok B</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;padding:14px}
.card{background:#171717;border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid #262626}
.saldo{background:linear-gradient(135deg,#16a34a,#15803d)}
input,select{width:100%;padding:12px;background:#262626;border:1px solid #333;border-radius:12px;color:#fff;margin-top:6px}
button{padding:12px;border:none;border-radius:12px;font-weight:700;cursor:pointer}
.badge{padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700}
.lunas{background:#16a34a}.belum{background:#ef4444}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #262626;font-size:13px;text-align:left}
</style>
</head>
<body>
<div style="max-width:600px;margin:auto">
<h2 style="margin:10px 0">Dashboard Kas<br><small style="color:#22c55e">karangtaruna-blokb.netlify.app</small></h2>
<div class="card saldo"><small>Saldo Kas</small><b id="saldo" style="font-size:32px;display:block">Rp 0</b><div style="display:flex;gap:8px;margin-top:10px;font-size:12px"><span id="masuk"></span> <span id="keluar"></span></div></div>
<div class="card"><h4>📄 Laporan</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<button onclick="exportPDF()" style="background:#fff;color:#000">📥 Export PDF</button>
<button onclick="window.print()" style="background:#262626;color:#fff;border:1px solid #444">🖨️ Cetak</button>
</div></div>
<div class="card"><h4>Tambah Anggota</h4><input id="nama" placeholder="Nama (contoh: Budi)"><input id="wa" placeholder="No WA 62812xxxx"><button onclick="addAnggota()" style="width:100%;margin-top:8px;background:#fff;color:#000">Simpan Anggota</button></div>
<div class="card"><h4>Input Transaksi</h4><select id="tipe"><option value="MASUK">Pemasukan / Iuran</option><option value="KELUAR">Pengeluaran</option></select><input id="jml" type="number" placeholder="Jumlah Rp"><input id="ket" placeholder="Keterangan"><button onclick="addKas()" style="width:100%;margin-top:8px;background:#22c55e;color:#fff">Simpan Transaksi</button></div>
<div class="card"><div style="display:flex;justify-content:space-between"><h4>Anggota - <span id="bulan"></span></h4></div><table><tbody id="listAnggota"></tbody></table><button onclick="tagihSemua()" style="background:#25D366;color:#fff;width:100%;margin-top:12px">Tagih WA Semua</button></div>
<div class="card"><h4>Buku Kas</h4><table><tbody id="listKas"></tbody></table></div>
</div>
<script>
let kas=JSON.parse(localStorage.getItem('kas_blokb')||'[]');let anggota=JSON.parse(localStorage.getItem('angg_blokb')||'[]');
let bulan=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][new Date().getMonth()]+" "+new Date().getFullYear();
document.getElementById('bulan').innerText=bulan;
function save(){localStorage.setItem('kas_blokb',JSON.stringify(kas));localStorage.setItem('angg_blokb',JSON.stringify(anggota));render()}
function addAnggota(){if(!nama.value||!wa.value)return alert('Lengkapi');anggota.push({id:Date.now(),nama:nama.value,wa:wa.value.replace(/\D/g,'')});nama.value='';wa.value='';save()}
function addKas(){if(!jml.value)return alert('Isi jumlah');kas.push({id:Date.now(),tipe:tipe.value,jumlah:+jml.value,ket:ket.value,bulan,tgl:new Date().toLocaleDateString('id-ID')});jml.value='';ket.value='';save()}
function tagih(n,w){window.open(`https://wa.me/${w}?text=${encodeURIComponent(`Halo ${n}, iuran Blok B ${bulan} Rp 50.000 - https://karangtaruna-blokb.netlify.app`)}`,'_blank')}
function tagihSemua(){let b=anggota.filter(a=>!kas.some(k=>k.tipe=='MASUK'&&k.ket.toLowerCase().includes(a.nama.toLowerCase())));if(!b.length)return alert('Lunas semua');b.forEach((a,i)=>setTimeout(()=>tagih(a.nama,a.wa),i*1200))}
function render(){let m=kas.filter(k=>k.tipe=='MASUK').reduce((a,b)=>a+b.jumlah,0);let k=kas.filter(k=>k.tipe=='KELUAR').reduce((a,b)=>a+b.jumlah,0);saldo.innerText='Rp '+(m-k).toLocaleString('id-ID');masuk.innerText='Masuk Rp '+m.toLocaleString();keluar.innerText='Keluar Rp '+k.toLocaleString();listAnggota.innerHTML=anggota.map(a=>{let l=kas.some(x=>x.tipe=='MASUK'&&x.ket.toLowerCase().includes(a.nama.toLowerCase()));return `<tr><td>${a.nama}<br><small>${a.wa}</small></td><td><span class="badge ${l?'lunas':'belum'}">${l?'LUNAS':'BELUM'}</span></td><td><button onclick="tagih('${a.nama}','${a.wa}')" style="background:#25D366;color:#fff;padding:6px 12px">WA</button></td></tr>`}).join('');listKas.innerHTML=kas.slice().reverse().map(x=>`<tr><td>${x.tgl}</td><td>${x.ket}</td><td>Rp ${x.jumlah.toLocaleString()}</td></tr>`).join('');}
function exportPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF();doc.text('Laporan Kas Karang Taruna Blok B - '+bulan,14,15);doc.text('Saldo: '+saldo.innerText,14,22);let dataA=anggota.map(a=>[a.nama,a.wa,kas.some(x=>x.ket.toLowerCase().includes(a.nama.toLowerCase()))?'LUNAS':'BELUM']);doc.autoTable({startY:28,head:[['Nama','WA','Status']],body:dataA});let dataK=kas.map(x=>[x.tgl,x.ket,x.tipe,'Rp '+x.jumlah]);doc.autoTable({startY:doc.lastAutoTable.finalY+10,head:[['Tgl','Ket','Tipe','Jml']],body:dataK});doc.save('Laporan-BlokB-'+bulan+'.pdf');}
render();
</script>
</body>
</html>
