<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karang Taruna Blok B</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>body{font-family:sans-serif;padding:20px;background:#f5f5f5} .card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px} input,button{padding:12px;width:100%;margin:5px 0;border-radius:8px;border:1px solid #ddd} button{background:#000;color:#fff;font-weight:bold} .admin{background:#111;color:#fff;padding:20px;border-radius:12px}</style>
</head><body>
<h2>🔥 Karang Taruna Blok B - V7.5 FIX</h2>
<div id="status" class="card">⏳ Loading...</div>

<div id="loginBox" class="card">
<input id="pass" type="password" placeholder="••••••••">
<button onclick="login()">LOGIN ADMIN</button>
</div>

<div id="app" style="display:none">
<div class="card"><h3>Total: Rp <span id="total">0</span> | <span id="jml">0</span> Orang</h3></div>
<div id="list" class="card"></div>

<div class="admin">
<h3>Panel Admin</h3>
<input id="nama" placeholder="Nama Anggota">
<input id="wa" placeholder="No WA 628...">
<input id="nom" type="number" placeholder="Nominal 10000">
<button onclick="tambah()" style="background:#22c55e">+ SIMPAN ONLINE (FIX)</button>
<hr>
<button onclick="uploadLama()" style="background:#f59e0b;color:#000">⬆️ UPLOAD DATA HP INI KE ONLINE</button>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...-GANTI-DENGAN-APIKEY-MU",
  authDomain: "blokb-online.firebaseapp.com",
  databaseURL: "https://blokb-online-default-rtdb.firebaseio.com",
  projectId: "blokb-online",
  appId: "1:...-GANTI"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let data = [];
let isAdmin = localStorage.getItem('admin')==='1';

function render(){
  document.getElementById('total').innerText = data.reduce((a,b)=>a+(b.nom||0),0).toLocaleString('id-ID');
  document.getElementById('jml').innerText = data.length;
  document.getElementById('list').innerHTML = data.map((x,i)=>`<div>${i+1}. ${x.nama} - Rp ${x.nom} <button onclick="hapus(${i})">Hapus</button></div>`).join('') || 'Belum ada data';
  document.getElementById('status').innerHTML = '✅ ONLINE - '+data.length+' orang | '+(isAdmin?'✅ ADMIN':'');
  if(isAdmin){document.getElementById('app').style.display='block'; document.getElementById('loginBox').style.display='none';}
}
db.ref('kartar').on('value', snap=>{
  data = snap.val() || [];
  render();
});

function login(){
  if(document.getElementById('pass').value==='blokb2026'){
    localStorage.setItem('admin','1'); isAdmin=true; render();
  } else alert('Password salah');
}
function simpan(){ db.ref('kartar').set(data).then(()=>alert('Berhasil disimpan ONLINE!')); }

function tambah(){
  const n=document.getElementById('nama').value, w=document.getElementById('wa').value, nominal=parseInt(document.getElementById('nom').value);
  if(!n||!nominal) return alert('Isi nama & nominal');
  data.push({nama:n, wa:w, nom:nominal, tgl:Date.now()});
  simpan();
  document.getElementById('nama').value=''; document.getElementById('wa').value=''; document.getElementById('nom').value='';
}
function hapus(i){ if(confirm('Hapus?')){ data.splice(i,1); simpan(); } }
function uploadLama(){
  const lama = JSON.parse(localStorage.getItem('kartar_data')||'[]');
  if(!lama.length) return alert('Di HP ini tidak ada data 89 orang. Buka di HP yang ada 89 orang!');
  if(confirm('Upload '+lama.length+' orang ke ONLINE?')){ data=lama; simpan(); }
}
if(isAdmin) render();
</script>
</body></html>
