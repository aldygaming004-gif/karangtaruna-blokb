<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOK B V7.2 FINAL</title>
<style>*{box-sizing:border-box;font-family:sans-serif}body{background:#FFF9E5;padding:10px} .card{border-radius:16px;padding:14px;margin-bottom:10px} .y{background:#FFD60A}.b{background:#1A1A1A;color:#fff}.w{background:#fff}.btn{border:0;padding:12px;border-radius:10px;font-weight:800;width:100%;margin-top:6px} input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin-bottom:6px}</style></head><body>
<div class="card y"><h2>👝 Rp <span id="saldo">0</span></h2><small id="info">V7.2 FINAL - No Firebase</small><br><button id="btnLogin" onclick="login()" style="padding:6px 10px;border-radius:20px;border:0;font-weight:bold">🔐 LOGIN</button></div>
<div class="card b"><div>👥 <span id="jml">0</span> Orang | Lunas <span id="lunas">0</span></div><div id="persen">0% Lunas</div></div>
<div class="card w"><b>Rekap Iuran</b><div id="rekap" style="margin-top:8px"></div></div>
<div class="card w" id="panel" style="display:none"><b>Admin Panel (pass: blokb2026)</b><input id="nama" placeholder="Nama"><input id="wa" placeholder="WA 628..."><input id="nom" type="number" placeholder="Nominal 10000"><button onclick="tambah()" class="btn" style="background:#1A1A1A;color:#FFD60A">+ TAMBAH</button><input id="keluarNom" type="number" placeholder="Pengeluaran"><button onclick="keluar()" class="btn" style="background:#FFD60A">CATAT KELUAR</button><hr>
<div style="background:#E8F5E9;padding:10px;border-radius:10px"><b>🔄 PINDAH HP / BACKUP:</b><button onclick="exportData()" class="btn" style="background:#00C853;color:#fff">⬇️ EXPORT & KIRIM VIA WA</button><input type="file" id="importFile" accept=".json" onchange="importData(event)" style="margin-top:10px"><button onclick="document.getElementById('importFile').click()" class="btn" style="background:#2196F3;color:#fff">⬆️ IMPORT FILE DARI WA</button><div id="recovery" style="font-size:11px;margin-top:8px"></div></div>
<button onclick="logout()" class="btn" style="background:#FF3B30;color:#fff">LOGOUT</button></div>
<script>
const HARGA=10000,PASS="blokb2026";let data=JSON.parse(localStorage.getItem('iuran_v6')||'[]');let pengeluaran=parseInt(localStorage.getItem('pengeluaran_v6')||'0');let isAdmin=localStorage.getItem('isAdmin')=='1';
function render(){let total=0,l=0;data.forEach(x=>{total+=(x.bayar||0);if((x.bayar||0)/HARGA>=10)l++});document.getElementById('saldo').innerText=(total-pengeluaran).toLocaleString('id-ID');document.getElementById('jml').innerText=data.length;document.getElementById('lunas').innerText=l;document.getElementById('persen').innerText=Math.round(data.length?l/data.length*100:0)+'% Lunas';document.getElementById('rekap').innerHTML=data.map(x=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:6px 0"><b>${x.nama}</b><span>${Math.floor((x.bayar||0)/HARGA)}/10 - Rp ${(x.bayar||0).toLocaleString()}</span></div>`).join('')||'Kosong';document.getElementById('info').innerText=`V7.2 | ${data.length} org | Rp ${total.toLocaleString()}`;let r=document.getElementById('recovery');r.innerHTML=`Data di HP ini: ${data.length} orang<br>Keys: ${Object.keys(localStorage).join(', ')}`;document.getElementById('panel').style.display=isAdmin?'block':'none';document.getElementById('btnLogin').innerText=isAdmin?'✅ ADMIN':'🔐 LOGIN';localStorage.setItem('iuran_v6',JSON.stringify(data));localStorage.setItem('pengeluaran_v6',pengeluaran);}
function login(){let p=prompt('Password:');if(p==PASS){isAdmin=true;localStorage.setItem('isAdmin','1');render();}else alert('Salah!');}function logout(){isAdmin=false;localStorage.removeItem('isAdmin');render();}
function tambah(){let n=document.getElementById('nama').value.trim(),w=document.getElementById('wa').value.trim(),o=parseInt(document.getElementById('nom').value);if(!n||!o)return;let i=data.findIndex(x=>x.nama.toLowerCase()==n.toLowerCase());if(i>=0)data[i].bayar+=o;else data.push({nama:n,wa:w,bayar:o});render();document.getElementById('nama').value='';document.getElementById('nom').value='';}
function keluar(){let o=parseInt(document.getElementById('keluarNom').value);if(!o)return;pengeluaran+=o;render();document.getElementById('keluarNom').value='';}
function exportData(){let blob=new Blob([JSON.stringify({data,pengeluaran,exported_at:new Date().toISOString()})],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`BLOKB_${data.length}org_${new Date().toISOString().slice(0,10)}.json`;a.click();alert('File terdownload! Sekarang kirim file itu via WA ke HP lain!');}
function importData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(ev){try{let j=JSON.parse(ev.target.result);let newData=j.data||j;if(Array.isArray(newData)){if(confirm(`Import ${newData.length} orang? Data lama akan diganti!`)){data=newData;pengeluaran=j.pengeluaran||0;render();alert('BERHASIL! '+data.length+' orang');}}else alert('Format salah');}catch(err){alert('Gagal: '+err)}};reader.readAsText(file);}
render();
</script></body></html>
